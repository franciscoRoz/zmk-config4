

### Keyboard name
# 1 nice
CONFIG_ZMK_KEYBOARD_NAME="Corne Fran"


### Boost Bluetooth TX power, also make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Tune bluetooth profiles for quick select
CONFIG_BT_MAX_CONN=5

### POWER OPTIONS
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
# 2 puchi 1 min (15*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Disable external power when not connected to USB
#CONFIG_ZMK_EXT_POWER_USB_ONLY=y

### LEDs instead of Nice!View
# Disable the ePaper display (nice!view) and enable generic status widgets + LED support
CONFIG_ZMK_DISPLAY=n

# Enable generic ZMK widget status modules (used when not using nice!view)
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# Optional: reduce wake latency (kept from previous config)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=0
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Improve compatibility with iPad / tablets
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Keep external power settings
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# LED support should be enabled via the shield/device-tree Kconfig or driver
# Configure Neopixel/WS2812 in the shield Kconfig or device tree overlay if needed
# (avoid setting undefined Kconfig symbols here to prevent build warnings/errors)