

### Keyboard name
# 1 nice
CONFIG_ZMK_KEYBOARD_NAME="Corne Fran"


### Boost Bluetooth TX power, also make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Tune bluetooth profiles for quick select
CONFIG_BT_MAX_CONN=5

### POWER OPTIONS
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
# 2 puchi 1 min (15*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Disable external power when not connected to USB
#CONFIG_ZMK_EXT_POWER_USB_ONLY=y

### Nice!View / ePaper Display
CONFIG_ZMK_DISPLAY=y

# NOTE: For nice!view, do not enable the generic ZMK widget status modules below.
# The shield already includes its own custom status widgets and they conflict at link time.
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Optional: reduce wake latency / improve responsiveness on ePaper screens
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=0
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Improve compatibility with iPad / tablets
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Keep display active while using the board
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000